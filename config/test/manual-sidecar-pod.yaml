apiVersion: v1
kind: Pod
metadata:
  name: manual-sidecar-test
  namespace: log-normalizer-test
  labels:
    app: manual-sidecar-test
spec:
  initContainers:
    - name: log-normalizer
      image: quay.io/opendatahub/log-normalizer:latest
      restartPolicy: Always
      volumeMounts:
        - name: log-normalizer-pipe
          mountPath: /var/run/lognormalizer
      env:
        - name: LOG_NORMALIZER_OUTPUT_FORMAT
          value: "json"
        - name: LOG_NORMALIZER_DRAIN_SIMILARITY
          value: "0.4"
        - name: LOG_NORMALIZER_DRAIN_MAX_CLUSTERS
          value: "1000"
        - name: LOG_NORMALIZER_MULTILINE_ENABLED
          value: "true"
        - name: LOG_NORMALIZER_CONSOLIDATORS
          value: "go,java,python"
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
  containers:
    - name: app
      image: busybox:latest
      command:
        - /bin/sh
        - -c
        - |
          while true; do
            echo '{"level":"info","ts":"2024-01-15T10:30:00Z","msg":"hello from app"}'
            echo "plain text log from dependency"
            echo "I0722 15:04:05.000000   12345 main.go:42] klog style message"
            echo 'level=info msg="logfmt style" key=value'
            sleep 2
          done
      volumeMounts:
        - name: log-normalizer-pipe
          mountPath: /var/run/lognormalizer
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
  volumes:
    - name: log-normalizer-pipe
      emptyDir: {}
