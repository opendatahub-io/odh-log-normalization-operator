apiVersion: apps/v1
kind: Deployment
metadata:
  name: mixed-logger
  namespace: log-normalizer-test
  labels:
    app: mixed-logger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mixed-logger
  template:
    metadata:
      labels:
        app: mixed-logger
    spec:
      containers:
        - name: logger
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                # Structured JSON (zap-style)
                echo '{"level":"info","ts":"2024-01-15T10:30:00Z","msg":"request completed","method":"GET","path":"/api/v1/users","status":200,"duration_ms":45}'

                # Plain text (fmt.Println style)
                echo "Processing batch 42 of 100, elapsed: 3.2s"

                # Klog format
                echo "I0722 15:04:05.123456   12345 controller.go:234] Reconciling resource default/my-resource"

                # Logfmt format
                echo 'level=warn msg="connection pool exhausted" pool_size=10 active=10 waiting=3 service=database'

                # Logrus text format
                echo 'time="2024-01-15T10:30:01Z" level=error msg="failed to connect" host=db.example.com port=5432 retry=3'

                # Simple warning
                echo "WARNING: disk usage at 85%, consider cleanup"

                sleep 2
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
